# docker-compose.yml — apigw-cnl-cross (producción)
# Uso: docker compose down && docker compose build && docker compose up -d
#
# En el servidor solo necesitas un .env con una línea:
#   VAULT_TOKEN=hvs.xxxx
# El entrypoint.sh carga el resto desde Vault al arrancar.

services:
  apigw-cnl-cross:
    build: .
    ports:
      - "10601:10601"
      - "20601:20601"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: "10601"
      VAULT_ADDR: "http://host.docker.internal:8200"
      VAULT_SECRET_PATH: "hce/nestjs/apigw-cnl-cross"
    volumes:
      - /proyectos/certs:/proyectos/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # El healthcheck de Docker usa el endpoint /health del gateway.
    # El bootstrap ya falla si Kafka no arranca (fail-fast en onModuleInit),
    # por lo que si el contenedor llega a responder /health, Kafka estuvo UP
    # al arrancar. start_period da tiempo al proceso de inicializarse antes
    # de que las retries cuenten como fallo definitivo.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:10601/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
