# docker-compose.yml — ag-pruebas-ag (producción)
# Uso: docker compose down && docker compose build && docker compose up -d
#
# En el servidor solo necesitas un .env con una línea:
#   VAULT_TOKEN=hvs.xxxx
# El entrypoint.sh carga el resto desde Vault al arrancar.

services:
  ag-pruebas-ag:
    build: .
    ports:
      - "10401:10401"
      - "20401:20401"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: "10401"
      VAULT_ADDR: "http://host.docker.internal:8200"
      VAULT_SECRET_PATH: "hce/nestjs/api-gateway"
    volumes:
      - /proyectos/certs:/proyectos/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:10401/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
